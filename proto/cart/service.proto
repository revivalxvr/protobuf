syntax = "proto3";

package cart;

import "proto/cart/type/cart.proto";

option go_package = "github.com/revivalxvr/protobuf/protogen/cart";

service ProductService {
  // Mengambil informasi produk secara massal untuk kebutuhan keranjang belanja
  rpc GetProductsForCart(cart.type.GetProductsForCartReq) returns (cart.type.GetProductsForCartRes) {}
}
